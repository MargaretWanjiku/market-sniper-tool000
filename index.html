<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Market Sniper</title>
    <style>
        :root {
            --bg-color: #0d1117;
            --card-bg: #161b22;
            --border-color: #30363d;
            --accent-green: #0ecb81;
            --accent-red: #f6465d;
            --text-main: #ffffff;
            --text-muted: #8b949e;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-main);
            margin: 0;
            padding: 15px;
            display: flex;
            justify-content: center;
        }

        .app-container {
            width: 100%;
            max-width: 420px;
        }

        .hidden {
            display: none !important;
        }

        /* Login Screen Styling */
        #login-screen {
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            height: 90vh;
            text-align: center;
        }

        .login-card {
            background: var(--card-bg);
            border: 1px solid var(--border-color);
            padding: 30px;
            border-radius: 16px;
            width: 100%;
            box-sizing: border-box;
        }

        .deriv-btn {
            background-color: #ff444f;
            color: white;
            border: none;
            padding: 14px;
            font-size: 16px;
            font-weight: bold;
            border-radius: 10px;
            cursor: pointer;
            width: 100%;
            margin-top: 20px;
        }
        .deriv-btn:hover {
            background-color: #e03b44;
        }

        /* Top Header */
        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
        }

        .logo-area {
            display: flex;
            align-items: center;
            gap: 8px;
            font-size: 20px;
            font-weight: bold;
            color: var(--accent-green);
        }

        .header-actions {
            display: flex;
            gap: 10px;
            align-items: center;
        }

        .active-badge {
            background: rgba(14, 203, 129, 0.1);
            color: var(--accent-green);
            border: 1px solid var(--accent-green);
            padding: 4px 12px;
            border-radius: 20px;
            font-size: 13px;
            font-weight: 600;
            cursor: pointer;
            display: flex;
            align-items: center;
            gap: 5px;
        }

        .help-btn {
            background: var(--accent-green);
            color: #000;
            border: none;
            width: 32px;
            height: 32px;
            border-radius: 50%;
            font-weight: bold;
            cursor: pointer;
        }

        /* Navigation Tabs */
        .nav-tabs {
            display: flex;
            gap: 8px;
            overflow-x: auto;
            padding-bottom: 10px;
            scrollbar-width: none;
        }
        .nav-tabs::-webkit-scrollbar {
            display: none;
        }

        .tab-btn {
            background: var(--card-bg);
            color: var(--text-muted);
            border: 1px solid var(--border-color);
            padding: 10px 16px;
            border-radius: 10px;
            font-size: 14px;
            font-weight: 500;
            cursor: pointer;
            white-space: nowrap;
            display: flex;
            align-items: center;
            gap: 6px;
        }

        .tab-btn.active {
            background: var(--accent-green);
            color: #000;
            border-color: var(--accent-green);
            font-weight: 600;
        }

        .section-content {
            display: none;
            margin-top: 15px;
        }
        .section-content.active {
            display: block;
        }

        /* Paywall Card */
        .paywall-card {
            background: var(--card-bg);
            border: 1px solid var(--border-color);
            border-radius: 16px;
            padding: 25px 20px;
            text-align: center;
        }

        .lock-icon {
            font-size: 32px;
            margin-bottom: 15px;
        }

        .paywall-title {
            font-size: 18px;
            font-weight: bold;
            margin-bottom: 10px;
        }

        .paywall-desc {
            color: var(--text-muted);
            font-size: 13px;
            line-height: 1.4;
            margin-bottom: 20px;
        }

        .price-tag {
            font-size: 20px;
            font-weight: bold;
            color: var(--text-main);
            margin-bottom: 20px;
        }
        .price-tag span {
            color: var(--accent-green);
        }

        .payment-methods {
            display: flex;
            background: var(--bg-color);
            padding: 4px;
            border-radius: 10px;
            border: 1px solid var(--border-color);
            margin-bottom: 20px;
        }

        .pay-method-btn {
            flex: 1;
            background: transparent;
            color: var(--text-muted);
            border: none;
            padding: 10px;
            border-radius: 8px;
            font-weight: 600;
            cursor: pointer;
        }
        .pay-method-btn.active {
            background: var(--card-bg);
            color: var(--accent-green);
            border: 1px solid var(--border-color);
        }

        .payment-box {
            background: var(--bg-color);
            border: 1px solid var(--border-color);
            border-radius: 10px;
            padding: 12px 15px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 15px;
            font-size: 14px;
        }

        .copy-btn {
            color: var(--accent-green);
            background: none;
            border: none;
            font-weight: bold;
            cursor: pointer;
        }

        .ref-input {
            width: 100%;
            background: var(--bg-color);
            border: 1px solid var(--border-color);
            border-radius: 10px;
            padding: 12px 15px;
            color: var(--text-main);
            box-sizing: border-box;
            margin-bottom: 15px;
            outline: none;
        }

        .unlock-btn {
            width: 100%;
            background: var(--accent-green);
            color: #000;
            border: none;
            padding: 14px;
            border-radius: 10px;
            font-weight: bold;
            font-size: 15px;
            cursor: pointer;
        }

        /* Market Cards */
        .market-card {
            background: var(--card-bg);
            border: 1px solid var(--border-color);
            border-radius: 16px;
            padding: 20px;
            margin-bottom: 15px;
            text-align: center;
        }

        .market-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 15px;
        }

        .market-name {
            font-size: 16px;
            font-weight: bold;
            text-align: left;
        }
        .market-symbol {
            font-size: 12px;
            color: var(--text-muted);
            text-align: left;
        }

        .live-tag {
            color: var(--accent-green);
            font-size: 12px;
            font-weight: 600;
        }

        .connection-status {
            color: var(--text-muted);
            font-size: 14px;
            margin: 15px 0;
        }

        .signal-indicator {
            width: 50px;
            height: 50px;
            border-radius: 50%;
            margin: 0 auto 15px auto;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 20px;
            font-weight: bold;
        }
        .signal-indicator.rise {
            background: rgba(14, 203, 129, 0.2);
            color: var(--accent-green);
        }
        .signal-indicator.fall {
            background: rgba(246, 70, 93, 0.2);
            color: var(--accent-red);
        }

        .confidence-text {
            color: #d29922;
            font-size: 13px;
            margin-bottom: 10px;
        }

        .action-signal-btn {
            width: 100%;
            padding: 12px;
            border-radius: 10px;
            font-weight: bold;
            font-size: 14px;
            border: 1px solid;
            background: transparent;
            cursor: pointer;
        }
        .action-signal-btn.rise {
            border-color: var(--accent-green);
            color: var(--accent-green);
        }
        .action-signal-btn.fall {
            border-color: var(--accent-red);
            color: var(--accent-red);
        }
    </style>
</head>
